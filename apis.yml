name: Tinfoil Security
description: >-
  Tinfoil Security was a web application and API security scanning company that
  provided automated dynamic (DAST) vulnerability testing for web apps and REST
  APIs. It was acquired by Synopsys in 2016 and folded into the Synopsys Software
  Integrity Group, which later became Black Duck. As of this enrichment pass its
  domain tinfoilsecurity.com no longer serves an independent site — every path
  returns an HTTP 302 redirect to blackduck.com — and there is no standalone
  Tinfoil Security developer portal, API documentation, OpenAPI definition,
  package registry presence, or /.well-known discovery surface remaining. This
  profile was surfaced as a 500 Global portfolio company and is retained as an
  acquired/defunct lead with no live API surface to harvest.
